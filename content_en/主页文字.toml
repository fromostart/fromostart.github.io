[projects]
type = "card"
title = "Research & Projects"

[[projects.items]]
title = "DebateForTruth"
byline = "Personal Project / AI-Assisted Full-Stack Development"
date = "In Development"
content = '''
I started this platform for reasoned discussion. I want people to state their views clearly, provide evidence, understand disagreements, and revise their judgments as new evidence emerges. I planned and built the site myself with AI assistance across the full stack, including discussion topics, accounts, moderation, and an in-platform points system.
'''
tags = [ "Next.js", "TypeScript", "PostgreSQL" ]

[[projects.items]]
title = "GCMA-Pro"
byline = "HONOR–HUST Joint Laboratory for Advanced Storage / Industry Collaboration"
date = "2025"
content = '''
An Android contiguous physical memory management project carried out with HONOR through the HONOR–HUST Joint Laboratory for Advanced Storage. I wrote MLP training code, flashed the specified Android system, reproduced an existing kernel approach, and modified existing scripts for testing on a physical phone.
'''
tags = [ "Android / Linux", "MLP", "System Experiments" ]

[[projects.items]]
title = "On-device Semantic File Search"
byline = "Low-latency, Memory-efficient Semantic Search"
date = "Research in Progress"
content = '''
Researching semantic file search under limited memory and flash-storage budgets. The work explores index layout, caching, metadata filtering, and vector access paths to reduce latency and memory use.
'''
tags = [ "Semantic Search", "Vector Indexing", "Memory & I/O" ]

[[projects.items]]
title = "Six-stage Pipelined RISC-V CPU"
byline = "Loongson Cup National Finals / Team Merit Award (Provincial First Prize)"
date = "2023"
content = '''
Designed and tested a six-stage pipelined RISC-V CPU. To address critical-path timing issues in the ALU and multiplier/divider, I split execution into EX and EX_sub stages and separated arithmetic operations from NPC and interrupt-decision logic, improving timing margin and processor clock frequency.
'''
tags = [ "Verilog", "RISC-V", "Processor Microarchitecture", "Timing Optimization" ]

[[projects.items]]
title = "Heliostat Field Optimization"
byline = "China Undergraduate Mathematical Contest in Modeling / Provincial First Prize"
date = "2023"
content = '''
Optimized heliostat field layout and efficiency using simulated annealing. I worked on mathematical modeling, numerical solving, and implementation in code.
'''
tags = [ "Python", "MATLAB", "Simulated Annealing", "Mathematical Modeling" ]

[[projects.items]]
title = "ASC Supercomputing Competition: Parallel Programs & Resource Allocation"
byline = "Parallel Program Debugging / Compute Resource Allocation"
date = "2023"
content = "Participated in the ASC Student Supercomputer Challenge, working on parallel program debugging and compute resource allocation."
tags = [ "High-performance Computing", "Parallel Computing", "Clusters" ]


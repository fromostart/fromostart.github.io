[about]
type = "about"
title = "About"
content = '''
I am a master’s student in Computer Science and Technology at Huazhong University of Science and Technology. At the Information Storage and Applications Laboratory, I study AI systems under resource constraints, with a focus on memory management, storage I/O, and on-device semantic search. I am also interested in edge intelligence, AGI, and storage systems for AI workloads.

I studied Computer Science and Technology at Wuhan University’s Hongyi Honor College and was recommended for postgraduate admission to HUST. In high school I took part in the Liaoning Young Talent Program in Physics. At university I competed in mathematical modeling, quantum programming, and the ASC Student Supercomputer Challenge. I also performed in our graduation play, *The Paint Is Still Wet*. Five months of working on lines and rehearsing stage movements with the cast made it one of my most memorable undergraduate experiences.

I’m an ENTJ. In a new team, I usually listen first, work through the problem and disagreements, then share my judgment and help move the work forward. At university, I learned to trust my own judgment. I started [DebateForTruth](/projects/) to make room for people who want to discuss ideas seriously, present evidence, and change their minds when the evidence changes.
'''


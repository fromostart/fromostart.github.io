# 首页自我介绍
[about]
type = "about"
title = "关于我"
content = '''
我目前在华中科技大学（HUST）计算机科学与技术学院读硕士，加入信息存储及应用实验室（武汉国家光电研究中心）研究storage for AI，目前工作关注内存管理、存储 I/O 和移动端语义检索。我也对边缘智能、agent、AGI、信息论等方向感兴趣。

我本科通过高考进入武汉大学（WHU）弘毅学堂（荣誉学院）学习计算机科学与技术，保研至华中科技大学。高中入选辽宁省英才计划（物理学科），大学参加了许多竞赛如数学建模、量子编程和 ASC 超算竞赛，以赛促学。

我数理基础较好，逻辑思维清晰，擅长并热爱分析、钻研艰深的难题，学习能力强，能快速理解新领域新知识；热爱创新，总能在实践中对已有知识提出新的见解；思维发散，往往从多个角度思考问题；善于检索、获取信息；喜欢高效的团队合作，倾向于分工解决复杂的问题。

我热爱生活，乐观自信，爱好广泛，加入武术、话剧社团，积极参加各种活动，毕业话剧演出观众600+；曾全程主办 60 余场校级辩论赛，单场到场观众 600 余人；负责实验室设备、团建经费管理，具备成熟的活动统筹、沟通协调经验，能在项目推进中主动识别问题、落地创新方案。

'''
[about.profile]
research_interests = ["AI 系统与性能优化", "内存管理与存储 I/O", "移动端语义检索与边缘智能"]
skills = ["C++", "Python", "MATLAB", "LaTeX", "Linux", "Android", "虚拟机", "英语六级", "普通话一级乙等"]

[[about.sections]]
id = "about"
type = "markdown"
title = "关于我"

[[about.sections]]

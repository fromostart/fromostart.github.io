# 研究与项目：byline 是卡片中金色的那一行
[projects]
type = "card"
title = "研究与项目"

[[projects.items]]
title = "DebateForTruth"
byline = "个人项目 / AI 辅助全栈开发"
date = "持续开发"
content = '''
我独立发起的理性讨论网站。我希望所有人都能清楚地表达观点、提交论据、理解分歧，并在新证据出现时修正判断。我使用 AI 辅助完成产品规划和全栈开发，实现议题讨论、账户、审核和站内虚拟积分等功能。
'''
tags = ["Next.js","TypeScript","PostgreSQL"]


[[projects.items]]
title = "GCMA-Pro"
byline = "荣耀-华科先进存储联合实验室 / 校企合作项目"
date = "2025"
content = '''
在荣耀-华科先进存储联合实验室与荣耀公司合作开展的 Android 连续物理内存管理项目。我编写 MLP 训练代码、刷入指定 Android 系统、复现内核方案，并修改已有脚本开展手机测试。
'''
tags = ["Android / Linux","MLP","系统实验"]


[[projects.items]]
title = "移动端文件语义检索"
byline = "低延迟、低内存语义检索研究"
date = "研究中"
content = '''
研究有限内存与闪存条件下的文件语义搜索，围绕索引布局、缓存、元数据过滤与向量访问路径设计低延迟、低内存的检索方案。
'''
tags = ["语义检索","向量索引","内存与 I/O"]


[[projects.items]]
title = "六级流水线 RISC-V CPU"
byline = "龙芯杯全国总决赛 / 团体奖"
date = "2023"
content = "六级流水线 RISC-V CPU 设计与全流程测试。针对 ALU、乘除法器带来的关键路径时序问题，将执行阶段拆分为 EX、EX_sub 两级流水，分离算术运算与 NPC、中断判断逻辑，优化时序裕量并提升处理器工作主频。"
tags = [ "RISC-V", "处理器微架构", "时序优化"]

[[projects.items]]
title = "定日镜场优化设计"
byline = "全国大学生数学建模竞赛 / 省级一等奖"
date = "2023"
content = '''
围绕定日镜场布局与效率优化，采用模拟退火算法求解，承担建模求解与代码实现。
'''
tags = ["Python","MATLAB","模拟退火","数学建模"]


[[projects.items]]
title = "ASC 超算竞赛：并行程序与算力调配"
byline = "并行程序调试 / 算力资源调配"
date = "2023"
content = '''
参与 ASC 世界大学生超级计算机竞赛，承担并行程序调试与算力资源调配。
'''
tags = ["高性能计算","并行计算","集群"]


